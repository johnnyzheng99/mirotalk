<!doctype html>
<html lang="en" class="no-js">
    <head>
        <!-- Title and Icon -->

        <title id="title">Host Protected login required.</title>
        <link id="icon" rel="shortcut icon" href="../images/favicon.ico" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/favicon.ico" />

        <!-- Meta Information -->

        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />


        <!-- StyleSheet -->

        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans:400,600" />
        <link rel="stylesheet" type="text/css" href="../css/landing.css" />
        <link rel="stylesheet" type="text/css" href="../css/Translate.css" />

        <!-- Bootstrap 5 -->

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
            crossorigin="anonymous"
        />
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"
        ></script>

        <!-- https://animate.style 4 using for swal fadeIn-Out -->

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

        <!-- Font Awesome CDN for icons -->

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

        <!-- Js scripts -->

        <script async src="../js/Umami.js"></script>
        <script defer src="../js/Brand.js"></script>
        <script async src="../js/Translate.js"></script>

        <script src="https://unpkg.com/animejs@3.0.1/lib/anime.min.js"></script>
        <script src="https://unpkg.com/scrollreveal@4.0.0/dist/scrollreveal.min.js"></script>

        <!-- xss -->
        <script src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>

        <!-- axios -->
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <!-- sweetalert -->
        <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.8"></script>
    </head>
    <body class="is-boxed has-animations">
        <div id="google_translate_element"></div>

        <div class="body-wrap">
            <header class="site-header">
                <div class="container">
                    <div class="site-header-inner">
                        <div class="brand header-brand">
                            <h1 class="m-0">
                                <a href="/">
                                    <img
                                        class="header-logo-image"
                                        src="../images/watermark.png"
                                        
                                    />
                                </a>
                            </h1>
                        </div>
                    </div>
                </div>
            </header>

            <main>
                <section class="hero">
                    <div class="container">
                        <div class="hero-inner">
                            <div class="hero-copy">
                                <div class="hidden lang-en">
                                    <h3  class="hero-title mt-0 mb-16">You’ve exited the meeting.</h3>
                                    <p   class="hero-paragraph" style="color: #ffffff;">
                                        The session may still be in progress. To rejoin, please use the same link or contact the host for more details.
                                        <!-- You'll be redirected to the room when they arrive. -->
                                    </p>
                                </div>
                                <div class="hidden lang-zh">
                                    <h3  class="hero-title mt-0 mb-16">您已退出会议。</h3>
                                    <p   class="hero-paragraph" style="color: #ffffff;">
                                        会话可能仍在进行中。若需重新加入，请使用相同的链接进入会议，或联系主持人了解详情。
                                        <!-- You'll be redirected to the room when they arrive. -->
                                    </p>
                                </div>
                                <div id="loginForm" style="display: none;">
                                    <br />
                                    <div class="mb-12">
                                        <input
                                            id="username"
                                            class="form-input"
                                            type="name"
                                            placeholder="Username"
                                            maxlength="254"
                                            required
                                        />
                                    </div>
                                    <br />
                                    <div class="mb-12">
                                        <input
                                            id="password"
                                            class="form-input"
                                            type="password"
                                            placeholder="Password"
                                            maxlength="36"
                                            required
                                        />
                                    </div>
                                    <div class="mt-24 mb-32">
                                        <button id="loginButton" class="button button-primary button-block">
                                            Login
                                        </button>
                                    </div>
                                </div>
                          
                            </div>                            
                        </div>
                    </div>
                </section>
            </main>
 
        </div>

        <script defer src="../js/Utils.js"></script>
        <script defer src="../js/Login.js"></script>
        <script defer src="../js/Landing.js"></script>
        <script async defer src="https://buttons.github.io/buttons.js"></script>
        <script type="text/javascript">
            const lang = (navigator.language || navigator.userLanguage).toLowerCase();

            let showLang = 'en';
            if (lang.startsWith('zh')) showLang = 'zh';

            document.addEventListener('DOMContentLoaded', () => {
                const target = document.querySelector(`.lang-${showLang}`);
                if (target) target.style.display = 'block';
            });
        </script>
    </body>
</html>
