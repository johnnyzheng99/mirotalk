<!doctype html>
<html lang="en" class="no-js">
    <head>
        <!-- Title and Icon -->

        <title id="title">Who are you.</title>
        <link id="icon" rel="shortcut icon" href="../images/favicon.ico" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/favicon.ico" />

        <!-- Meta Information -->

        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        
        <!-- StyleSheet -->

        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans:400,600" />
        <link rel="stylesheet" type="text/css" href="../css/landing.css" />
        <link rel="stylesheet" type="text/css" href="../css/Translate.css" />
 
        <!-- Js scripts -->

        <script async src="../js/Umami.js"></script>
        <script defer src="../js/Brand.js"></script>
        <script async src="../js/Translate.js"></script>

        <!-- xss -->

        <script src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>

        <!-- axios -->

        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <script src="https://unpkg.com/animejs@3.0.1/lib/anime.min.js"></script>
        <script src="https://unpkg.com/scrollreveal@4.0.0/dist/scrollreveal.min.js"></script>
    </head>
    <body class="is-boxed has-animations">
        <div id="google_translate_element"></div>

        <div class="body-wrap">
            <header class="site-header">
                <div class="container">
                    <div class="site-header-inner">
                        <div class="brand header-brand">
                            <h1 class="m-0">
                                <a href="/">
                                    <img
                                        class="header-logo-image"
                                        src="../images/watermark.png"
                                        
                                    />
                                </a>
                            </h1>
                        </div>
                    </div>
                </div>
            </header>
            <main>
                <section class="hero">
                    <div class="container">
                        <div class="hero-inner">
                            <div class="hero-copy ">
                                <div class="hidden lang-en">
                                    <h1 id="whoAreYouTitle" class="hero-title mt-0 mb-16">Meeting not started yet</h1>
                                    <p id="whoAreYouDescription" class="hero-paragraph">
                                        Waiting for the host to join...<br />
                                        You will be able to join once the host starts the meeting. <br />
                                        <!-- You'll be redirected to the room when they arrive. -->
                                    </p>
                                </div>
                                <div class="hidden lang-zh">
                                    <h1 id="whoAreYouTitle" class="hero-title mt-0 mb-16">会议还未开始</h1>
                                    <p id="whoAreYouDescription" class="hero-paragraph">
                                        等待主持人加入...<br />
                                        主持人加入后会议将自动开始。如果没有跳转到会议房间,请刷新页面或者点击下面的按钮加入会议。<br />
                                        <!-- You'll be redirected to the room when they arrive. -->
                                    </p>
                                </div>
                                <div class="hero-cta">
                                    <!--<a id="presenterLoginButton" class="button button-primary pulse">LOGIN</a>-->
                                    <a id="guestJoinRoomButton" class="button button-primary pulse">JOIN ROOM</a>
                                </div>
                            </div>                            
                        </div>
                    </div>
                </section>
            </main>

 
        </div>
        <script async src="../js/WhoAreYou.js"></script>
        <script defer src="../js/Landing.js"></script>
        <script async defer src="https://buttons.github.io/buttons.js"></script>
        <script type="text/javascript">
            const lang = (navigator.language || navigator.userLanguage).toLowerCase();

            let showLang = 'en';
            if (lang.startsWith('zh')) showLang = 'zh';

            document.addEventListener('DOMContentLoaded', () => {
                const target = document.querySelector(`.lang-${showLang}`);
                if (target) target.style.display = 'block';
            });
        </script>
    </body>
</html>
